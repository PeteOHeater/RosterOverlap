<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Roster Overlap Finder</title>

<style>
:root {
  --bg: #080b10;
  --surface: #0f1219;
  --surface2: #161b24;
  --border: #232a38;
  --border2: #2d3548;
  --accent: #38bdf8;
  --accent-dim: rgba(56,189,248,0.08);
  --orange: #fb923c;
  --purple: #a78bfa;
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.07);
  --yellow: #fbbf24;
  --red: #f87171;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #94a3b8;
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;min-height:100vh;}
body::after{content:'';position:fixed;top:-40%;left:-20%;width:80vw;height:80vw;background:radial-gradient(ellipse,rgba(56,189,248,0.04) 0%,transparent 60%);pointer-events:none;z-index:0;}
.page{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}

/* Header */
.site-header{padding:56px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
h1{font-size:clamp(36px,5vw,58px);font-weight:700;letter-spacing:-2px;line-height:1.05;}
h1 em{font-style:normal;color:var(--accent);}
.header-sub{margin-top:12px;color:var(--text2);font-size:17px;line-height:1.5;max-width:480px;}
.bid-tag{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:7px 16px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);}

/* Upload */
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px;}
.upload-slot{background:var(--surface);border:1px dashed var(--border2);border-radius:14px;padding:28px 24px 24px;cursor:pointer;position:relative;transition:border-color .2s,background .2s,transform .15s;overflow:hidden;min-height:140px;}
.upload-slot:hover{border-color:var(--accent);background:rgba(56,189,248,.03);transform:translateY(-1px);}
.upload-slot.loaded{border-style:solid;cursor:default;}
.upload-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2;}
.upload-slot.loaded input[type=file]{display:none;}
.upload-slot-icon{font-size:30px;margin-bottom:10px;}
.upload-slot-title{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.loaded-info{margin-top:10px;}
.pilot-name-display{font-weight:600;font-size:18px;margin-bottom:4px;}
.pilot-meta{font-family:var(--mono);font-size:12px;color:var(--text2);}
.remove-btn{position:absolute;top:12px;right:12px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:var(--red);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;z-index:3;font-family:var(--mono);transition:all .15s;}
.remove-btn:hover{background:rgba(248,113,113,.2);}
.add-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center;}
.add-slot-icon{font-size:28px;}

/* Controls */
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:48px;}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:12px 24px;border-radius:8px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s;}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.btn:disabled{opacity:.3;pointer-events:none;}
.btn-primary{background:var(--accent);color:#080b10;border-color:var(--accent);font-weight:700;box-shadow:0 0 20px rgba(56,189,248,.2);}
.btn-primary:hover:not(:disabled){background:#7dd3fc;border-color:#7dd3fc;color:#080b10;}
.error-box{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:14px 18px;margin-bottom:24px;font-size:14px;color:var(--red);font-family:var(--mono);}

/* Results */
#results{display:none;}
#results.show{display:block;}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:40px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;}
.stat-tile-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.stat-tile-value{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;}
.stat-tile-sub{font-size:12px;color:var(--text3);margin-top:4px;}

/* Section heading */
.section-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.section-head-title{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);white-space:nowrap;}
.section-head-line{flex:1;height:1px;background:var(--border);}

/* Pair tabs */
.pair-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.pair-tab{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:9px 18px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;}
.pair-tab:hover{border-color:var(--border2);color:var(--text2);}
.pair-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.pair-count{opacity:.5;font-size:10px;}

/* Legend */
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
.legend-item{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.5px;}
.legend-swatch{width:12px;height:12px;border-radius:2px;}
.legend-dot{width:11px;height:11px;border-radius:50%;}

/* Calendar */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:40px;}
.cal-scroll{overflow-x:auto;}
.cal-table{min-width:760px;width:100%;}
.cal-head{display:grid;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.cal-head .ch{padding:12px 18px;}
.month-row{padding:8px 18px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);}
.cal-row{display:grid;border-bottom:1px solid var(--border);transition:background .1s;}
.cal-row:last-child{border-bottom:none;}
.cal-row:hover{background:rgba(255,255,255,.015);}
.cal-row.has-overlap{background:rgba(52,211,153,.03);}
.cal-row.has-overlap:hover{background:rgba(52,211,153,.05);}
.cell{padding:12px 18px;border-right:1px solid var(--border);}
.cell:last-child{border-right:none;}
.cell-date{min-width:90px;}
.date-num{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;color:var(--text);}
.date-day{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
.cell-pilot{display:flex;flex-direction:column;gap:4px;min-width:0;}

/* Duty tag — bigger and clearer */
.duty-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.duty-tag.type-fly{background:rgba(56,189,248,.12);color:var(--accent);}
.duty-tag.type-off{background:rgba(71,85,105,.2);color:var(--text3);}
.duty-tag.type-leave{background:rgba(167,139,250,.12);color:var(--purple);}
.duty-tag.type-rsv{background:rgba(251,191,36,.1);color:var(--yellow);}
.duty-tag.type-ground{background:rgba(56,189,248,.07);color:#7dd3fc;}
.duty-tag.type-unknown{color:var(--text3);}

/* Pattern route — the full route string shown below the tag */
.pattern-route{font-size:12px;color:var(--text2);font-family:var(--mono);padding-left:2px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

.cell-overlap{min-width:185px;display:flex;flex-direction:column;gap:5px;}
.overlap-none{color:var(--border2);font-size:22px;display:flex;align-items:center;height:100%;}
.ov-block{background:var(--green-dim);border:1px solid rgba(52,211,153,.2);border-radius:6px;padding:7px 12px;}
.ov-port{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green);}
.ov-time{font-family:var(--mono);font-size:12px;color:#6ee7b7;margin-top:1px;}
.ov-dur{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px;}

/* Summary */
.summary-list{margin-bottom:60px;}
.summary-card{display:flex;gap:20px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:12px;padding:20px 22px;margin-bottom:12px;transition:border-color .15s,background .15s;}
.summary-card:hover{background:var(--surface2);}
.sum-left{flex:1;min-width:0;}
.sum-date{font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:4px;}
.sum-port{font-size:20px;font-weight:600;margin-bottom:4px;}
.sum-port span{font-size:15px;font-weight:400;color:var(--text2);margin-left:8px;}
.sum-window{font-family:var(--mono);font-size:13px;color:var(--text2);margin-bottom:8px;}
.sum-pilots{display:flex;flex-direction:column;gap:5px;}
.sum-pilot-line{font-size:14px;color:var(--text2);display:flex;align-items:flex-start;gap:8px;}
.sum-pilot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.sum-pilot-text{display:flex;flex-direction:column;gap:1px;}
.sum-pilot-name{font-weight:600;color:var(--text);}
.sum-pilot-pattern{font-family:var(--mono);font-size:12px;color:var(--text3);}
.sum-right{text-align:right;flex-shrink:0;}
.sum-dur{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);line-height:1;}
.sum-dur-label{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.summary-total{text-align:right;padding:12px 22px;font-family:var(--mono);font-size:13px;color:var(--text3);}
.summary-total strong{color:var(--green);}
.no-overlap-msg{text-align:center;padding:60px 40px;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
.no-overlap-msg .icon{font-size:44px;margin-bottom:12px;}
.no-overlap-msg h3{font-size:20px;font-weight:600;margin-bottom:8px;}
.no-overlap-msg p{color:var(--text2);font-size:16px;}
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 11pt; }
  body::after { display: none; }
  .page { max-width: 100%; padding: 0; }
  .site-header { padding: 16pt 0 12pt; border-bottom: 1pt solid #ccc; margin-bottom: 20pt; }
  h1 { font-size: 22pt; color: #000; letter-spacing: -1px; }
  h1 em { color: #0077aa; }
  .header-sub { color: #444; font-size: 10pt; }
  .bid-tag { border: 1pt solid #ccc; color: #444; font-size: 9pt; }
  .upload-grid, .controls, #error-box { display: none !important; }
  .stats-row { gap: 8pt; margin-bottom: 20pt; }
  .stat-tile { background: #f5f5f5 !important; border: 1pt solid #ddd !important; border-radius: 6pt; padding: 10pt 14pt; }
  .stat-tile-label { color: #666; font-size: 8pt; }
  .stat-tile-value { font-size: 20pt; color: #000; }
  .stat-tile-value[style*="accent"] { color: #0077aa !important; }
  .stat-tile-value[style*="green"] { color: #007a4d !important; }
  .stat-tile-value[style*="orange"] { color: #c04d00 !important; }
  .stat-tile-value[style*="purple"] { color: #5b2d8e !important; }
  .stat-tile-sub { color: #888; font-size: 9pt; }
  .pair-tabs { display: none !important; }
  .section-head-title { color: #888; font-size: 8pt; }
  .section-head-line { background: #ccc; }
  .legend-item { color: #555; font-size: 9pt; }
  .cal-wrap { border: 1pt solid #ccc; border-radius: 4pt; }
  .cal-head { background: #f0f0f0 !important; }
  .cal-head .ch { color: #555; font-size: 8pt; padding: 6pt 10pt; }
  .month-row { background: #e8f4fb !important; color: #0077aa; font-size: 8pt; padding: 5pt 10pt; }
  .cal-row { background: #fff !important; }
  .cal-row.has-overlap { background: #f0faf5 !important; }
  .cell { padding: 6pt 10pt; border-right: 1pt solid #eee; }
  .date-num { font-size: 14pt; color: #000; }
  .date-day { font-size: 7pt; color: #888; }
  .duty-tag { font-size: 8pt; padding: 2pt 6pt; }
  .duty-tag.type-fly { background: #e8f4fb !important; color: #0077aa !important; border-left-color: #0077aa !important; }
  .duty-tag.type-off { background: #f0f0f0 !important; color: #666 !important; }
  .duty-tag.type-leave { background: #f3eeff !important; color: #5b2d8e !important; }
  .duty-tag.type-rsv { background: #fffbe6 !important; color: #7a5800 !important; }
  .pattern-route { font-size: 8pt; color: #444; }
  .ov-block { background: #f0faf5 !important; border: 1pt solid #a3d9bf !important; border-radius: 3pt; padding: 4pt 7pt; }
  .ov-port { color: #007a4d; font-size: 11pt; }
  .ov-time { color: #007a4d; font-size: 9pt; }
  .ov-dur { color: #666; font-size: 8pt; }
  .overlap-none { color: #ddd; }
  .summary-card { background: #fff !important; border: 1pt solid #ccc !important; border-left: 3pt solid #007a4d !important; border-radius: 4pt; padding: 10pt 14pt; margin-bottom: 8pt; break-inside: avoid; }
  .sum-date { color: #0077aa; font-size: 10pt; }
  .sum-port { font-size: 15pt; color: #000; }
  .sum-port span { color: #555; font-size: 11pt; }
  .sum-window { color: #444; font-size: 10pt; }
  .sum-pilot-name { color: #000; }
  .sum-pilot-pattern { color: #555; font-size: 9pt; }
  .sum-dur { color: #007a4d; font-size: 20pt; }
  .sum-dur-label { color: #888; font-size: 8pt; }
  .summary-total { color: #555; font-size: 10pt; }
  .summary-total strong { color: #007a4d; }
  .no-overlap-msg { border: 1pt solid #ccc !important; background: #fafafa !important; }
  .no-overlap-msg h3, .no-overlap-msg p { color: #444; }
  @page { margin: 15mm 12mm; size: A4; }
}

<body>
<div class="page">
  <header class="site-header">
    <div>
      <h1>Roster<br><em>Overlap</em> Finder</h1>
      <p class="header-sub">Compare WEBCIS and ARMS crew rosters, including overnight stays and international trips. Files stay on your device; nothing is uploaded.</p>
    </div>
    <div><div class="bid-tag" id="bid-tag">Upload rosters to begin</div></div>
  </header>

  <details id="roster-setup" open><summary>Rosters &amp; settings</summary><div id="upload-grid" class="upload-grid"></div>

<script>
'use strict';
// All intervals are UTC instants; YYYY-MM-DD strings are local roster/calendar dates.
const COLOURS=['#38bdf8','#fb923c','#a78bfa','#34d399','#fbbf24','#f472b6'];

const ZONES={ADL:'Australia/Adelaide',MEL:'Australia/Melbourne',SYD:'Australia/Sydney',BNE:'Australia/Brisbane',OOL:'Australia/Brisbane',HTI:'Australia/Brisbane',MCY:'Australia/Brisbane',CNS:'Australia/Brisbane',TSV:'Australia/Brisbane',MKY:'Australia/Brisbane',ROK:'Australia/Brisbane',PER:'Australia/Perth',DRW:'Australia/Darwin',CBR:'Australia/Sydney',NTL:'Australia/Sydney',HBA:'Australia/Hobart',AKL:'Pacific/Auckland',WLG:'Pacific/Auckland',LAX:'America/Los_Angeles',DFW:'America/Chicago',LHR:'Europe/London',SIN:'Asia/Singapore',HKG:'Asia/Hong_Kong',NRT:'Asia/Tokyo',HND:'Asia/Tokyo',JNB:'Africa/Johannesburg',SCL:'America/Santiago',BKK:'Asia/Bangkok',DPS:'Asia/Makassar',NAN:'Pacific/Fiji',CHC:'Pacific/Auckland',ZQN:'Pacific/Auckland'};
let pilots=[],pairsData=[],activePair=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate=d=>new Date(d+'T12:00Z').toLocaleDateString('en-AU',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
const duration=m=>`${Math.floor(m/60)}h ${Math.round(m%60)}m`;
function parts(t,port){if(!ZONES[port])throw Error('Unsupported airport time zone: '+port);return Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:ZONES[port],year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(t).map(p=>[p.type,p.value]));}
function localDate(t,port){const p=parts(t,port);return `${p.year}-${p.month}-${p.day}`;}
function clock(t,port){const p=parts(t,port);return `${p.hour}:${p.minute}`;}
function instant(day,hhmm,port){
 if(!/^\d{4}$/.test(hhmm)||+hhmm.slice(0,2)>23||+hhmm.slice(2)>59)throw Error('Invalid roster time: '+hhmm);
 const target=Date.parse(`${day}T${hhmm.slice(0,2)}:${hhmm.slice(2)}:00Z`);let t=target;
 for(let i=0;i<4;i++){const p=parts(t,port);const wall=Date.parse(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:00Z`);const delta=target-wall;if(!delta)return t;t+=delta;}

}
const namedDate=s=>{const m=s.match(/(\d{2})([A-Za-z]{3})(\d{2,4})/);if(!m)throw Error('Missing roster date');return `${m[3].length===2?'20'+m[3]:m[3]}-${String(MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1).padStart(2,'0')}-${m[1]}`;};
function classify(code){return /^(D\/O|X|RX|AV|A|BL|MS|AL)$/.test(code)?'DO':/^(LA|AL)/.test(code)?'LEAVE':/^(R4|R5)$/.test(code)?'RESERVE':'OTHER';}
function parseRoster(text,colour){
 text=text.replace(/\r/g,'');const name=text.match(/Name\s*:\s*(.*?)\s{2,}(?:Staff|Category)/i)?.[1]?.trim().replace(/\s+/g,' ');
 const base=text.match(/Base\s*:\s*([A-Z]{3})/)?.[1],staffNo=text.match(/Staff No\s*:\s*(\d+)/)?.[1];
 if(!name||!base||!staffNo)throw Error('Not a recognised crew roster: name, base or staff number missing.');
 const p={name,base,home:base,overrides:[],commutes:[],staffNo,colour,duties:[],patterns:[],warnings:[],format:/OPERATIONS ROSTER/.test(text)?'ARMS':'WEBCIS'};
 if(p.format==='WEBCIS')parseShort(text,p);else parseLong(text,p);
 p.duties.sort((a,b)=>a.date.localeCompare(b.date));
 if(!p.duties.length)throw Error('No dated roster rows found. Please export a full text roster.');
 p.start=p.duties[0].date;p.end=p.duties.at(-1).date;
 p.patterns.sort((a,b)=>a.start-b.start);
 for(const pat of p.patterns){if(pat.end<=pat.start)throw Error('Invalid duty chronology.');for(const l of pat.legs)if(l.end<=l.start)throw Error('Invalid sector chronology.');}

}
function parseShort(text,p){
 const range=text.match(/Available Date\/Time this.*?:\s*(\d{2}[A-Za-z]{3}\d{2})/);if(!range)throw Error('WEBCIS period dates missing.');
 let cursor=namedDate(range[1]);let last=+cursor.slice(8);
 for(const line of text.split('Pattern Details')[0].split('\n')){const m=line.match(/^\s*(\d{2})\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(.*)/);if(!m)continue;
 const n=+m[1];if(n<last){const dt=new Date(cursor+'T12:00Z');dt.setUTCMonth(dt.getUTCMonth()+1,1);cursor=iso(dt);}last=n;
 const date=cursor.slice(0,8)+m[1],code=m[3].trim().split(/\s+/)[0];p.duties.push({date,code,type:classify(code)});}
 const startYear=+cursor.slice(0,4);let legs=[];
 for(const line of text.split('\n')){
 const m=line.match(/^\s*(\d{2})([A-Z][a-z]{2})\s+(?:([PC])\s+)?([A-Z0-9]+)\s+([A-Z]{3})\s+(\d{4})\s+([A-Z]{3})\s+(\d{4})/);
 if(m){let day=`${startYear}-${String(MONTHS.indexOf(m[2])+1).padStart(2,'0')}-${m[1]}`;
 // Pick the year closest to this file's own period, independent of upload order.
 const first=p.duties[0].date;if(day<dayAdd(first,-180))day=(startYear+1)+day.slice(4);if(day>dayAdd(first,180))day=(startYear-1)+day.slice(4);
 const start=instant(day,m[6],m[5]);let end=instant(day,m[8],m[7]);if(end<=start)end=instant(dayAdd(day,1),m[8],m[7]);
 legs.push({dep:m[5],arr:m[7],start,end,service:m[4],kind:m[3]||'FLIGHT'});continue;}
 const r=line.match(/Rpt\s+(\d{4})\s+Rls\s+(\d{4})/);if(r&&legs.length){const first=legs[0],last=legs.at(-1);let start=instant(localDate(first.start,first.dep),r[1],first.dep);if(start>first.start)start=instant(dayAdd(localDate(first.start,first.dep),-1),r[1],first.dep);let end=instant(localDate(last.end,last.arr),r[2],last.arr);if(end<last.end)end=instant(dayAdd(localDate(last.end,last.arr),1),r[2],last.arr);p.patterns.push({start,end,legs});legs=[];}}
 if(legs.length)throw Error('Incomplete WEBCIS duty: release time missing.');
 const covered=new Set(p.patterns.flatMap(x=>x.legs.map(l=>localDate(l.start,l.dep))));
 for(const d of p.duties)if(d.type==='OTHER'&&!covered.has(d.date)){d.unavailable=true;p.warnings.push(`${fmtDate(d.date)}: ${d.code} has no usable location detail; assumed away / unavailable for catch-ups.`);}
}
function parseLong(text,p){
 const report=text.match(/(\d{2})\s+([A-Za-z]{3})\s+(20\d{2})/);if(!report)throw Error('ARMS report year missing.');const year=+report[3];
 const table=text.split('**** END OF REPORT')[0];
 for(const line of table.split('\n'))for(const cell of line.split('|')){const m=cell.match(/^\s*(\d{2})\/(\d{2})\s+[A-Z]\s+(\S+)(.*)/);if(!m)continue;let y=year;const reportMonth=MONTHS.indexOf(report[2])+1;if(reportMonth>9&&+m[2]<3)y++;if(reportMonth<3&&+m[2]>9)y--;p.duties.push({date:`${y}-${m[2]}-${m[1]}`,code:m[3],type:classify(m[3]),tail:m[4]});}
 p.duties.sort((a,b)=>a.date.localeCompare(b.date));
 const templates={};let code;
 for(const line of text.split('\n')){const h=line.match(/^Pattern:\s*(\S+)/);if(h){code=h[1];templates[code]=[];continue;}
 const m=line.match(/^(QFA\d+)\s+.*?([A-Z]{3})\/([A-Z]{3})\s+(?:(\d{4})\s+)?(MO|TU|WE|TH|FR|SA|SU)\s+(\d{4})\s+(\d{4})\s+(MO|TU|WE|TH|FR|SA|SU)\s+(\d{4})\s+(\d{4})/);
 if(m&&code)templates[code].push({service:m[1],dep:m[2],arr:m[3],report:m[4],dw:m[5],dt:m[6],du:m[7],aw:m[8],at:m[9],au:m[10],kind:line.includes('PAX')?'P':'FLIGHT'});}
 for(let i=0;i<p.duties.length;i++){const d=p.duties[i];if(d.type!=='OTHER')continue;
 let j=i;while(j+1<p.duties.length&&p.duties[j+1].code===d.code&&p.duties[j+1].date===dayAdd(p.duties[j].date,1))j++;
 const template=templates[d.code];if(!template?.length){for(let k=i;k<=j;k++)p.duties[k].unavailable=true;p.warnings.push(`${fmtDate(d.date)}: ${d.code} has no pattern detail; assumed away / unavailable for catch-ups.`);i=j;continue;}
 const legs=[];let previous=-Infinity;
 for(const t of template){let start,depDay;
 for(let offset=0;offset<=10;offset++){const day=dayAdd(d.date,offset);if(weekday(day)!==t.dw)continue;const candidate=instant(day,t.dt,t.dep);if(candidate>=previous){start=candidate;depDay=day;break;}}
 if(start===undefined)throw Error('Cannot date ARMS pattern '+d.code);
 let end;for(let offset=-1;offset<=4;offset++){const day=dayAdd(depDay,offset);if(weekday(day)!==t.aw)continue;const candidate=instant(day,t.at,t.arr);if(candidate>start&&candidate-start<=30*3600000){end=candidate;break;}}
 if(end===undefined)throw Error('Cannot date arrival in '+d.code);
 const utc=t=>new Date(t).toISOString().slice(11,16).replace(':','');if(utc(start)!==t.du||utc(end)!==t.au)throw Error('Local/UTC times disagree in '+d.code+'; cannot safely compare.');
 legs.push({...t,start,end});previous=end;}
 const first=legs[0],last=legs.at(-1),reportTime=template[0].report; if(!reportTime)throw Error('Report time missing for '+d.code);
 let start=instant(localDate(first.start,first.dep),reportTime,first.dep);if(start>first.start)start=instant(dayAdd(localDate(first.start,first.dep),-1),reportTime,first.dep);
 const final=p.duties[j],times=[...final.tail.matchAll(/\b(\d{4})\b/g)].map(x=>x[1]);const release=times.at(-1);
 if(!release)throw Error('Release time missing for '+d.code);const end=instant(final.date,release,p.base);
 if(end<last.end||end-last.end>12*3600000)throw Error('Release date does not match '+d.code);

}
function buildTimeline(p,assumeBase=true){
 const out=[];const add=(start,end,port,desc,assumed=false)=>{if(end>start)out.push({start,end,port,desc,assumed});};
 for(const pat of p.patterns){const legs=pat.legs,route=legs[0].dep+' → '+legs.map(l=>l.arr).join(' → ');
 add(pat.start,legs[0].start,legs[0].dep,'Reporting / pre-flight · '+route);
 for(let i=0;i<legs.length;i++){const l=legs[i];if(l.dep===l.arr)add(l.start,l.end,l.dep,'Training / ground duty · '+l.service);
 const next=legs[i+1];if(next&&next.dep===l.arr)add(l.end,next.start,l.arr,(next.start-l.end>6*3600000?'Layover':'Turn')+' · '+route);}
 add(legs.at(-1).end,pat.end,legs.at(-1).arr,'Post-flight · '+route);
 }
 // Join consecutive short-haul duty blocks at a known away port, including the overnight.
 for(let i=0;i<p.patterns.length-1;i++){const a=p.patterns[i],b=p.patterns[i+1],port=a.legs.at(-1).arr;
 if(port!==p.base&&port===b.legs[0].dep&&b.start>a.end&&b.start-a.end<72*3600000)add(a.end,b.start,port,'Away-port layover');}
 const home=p.home||p.base;
 const departures=new Set(p.patterns.filter(x=>x.legs[0].dep===p.base).map(x=>localDate(x.start,home)));
 const dates=[...new Set(p.duties.map(d=>d.date))];
 if(assumeBase){
 for(const date of dates){const rows=p.duties.filter(d=>d.date===date);
 const before=departures.has(dayAdd(date,1));
 if(!departures.has(date)&&(rows.every(d=>d.type==='DO')||(before&&rows.every(d=>['DO','RESERVE','LEAVE'].includes(d.type)))))
 add(instant(date,'0000',home),instant(dayAdd(date,1),'0000',home),home,(before?'Day before departure':'Full day off')+' · assumed home '+home,true);
 }
 // Same-day duties starting at home allow home presence until reporting.
 for(const pat of p.patterns){const date=localDate(pat.start,home);
 if(pat.legs[0].dep===home&&pat.legs.at(-1).arr===home&&localDate(pat.end,home)===date)
 add(instant(date,'0000',home),pat.start,home,'Before same-day duty · assumed home '+home,true);
 }
 for(const pat of p.patterns){const date=localDate(pat.end,home);
 if(pat.legs.at(-1).arr===p.base&&!p.patterns.some(next=>next!==pat&&next.start>=pat.end&&localDate(next.start,home)===date))add(pat.end,instant(dayAdd(date,1),'0000',home),home,'Arrival day · assumed home immediately after release (commute not timed)',true);
 }
 }
 // A personal location can never replace rostered duty or an away-port layover.
 const blockers=[...p.duties.filter(d=>d.unavailable).map(d=>({start:instant(d.date,'0000',p.base),end:instant(dayAdd(d.date,1),'0000',p.base)})),...p.patterns.map(x=>({start:x.start,end:x.end})),...out.filter(x=>!x.assumed&&x.port!==p.base)];
 const subtract=(items,blocks)=>{for(const block of blocks)items=items.flatMap(x=>{if(block.end<=x.start||block.start>=x.end)return [x];return [...(block.start>x.start?[{...x,end:block.start}]:[]),...(block.end<x.end?[{...x,start:block.end}]:[])];});return items;};
 // R5 is reserve 05:00–17:00 in the selected home port, per roster-code rules.
 // Actual trips and away-port stays take priority if a reserve row is superseded.
 const reserve=subtract(p.duties.filter(d=>d.code==='R5').map(d=>({start:instant(d.date,'0500',home),end:instant(d.date,'1700',home),port:home,desc:'Reserve R5 · 05:00–17:00 · home port '+home,assumed:false})),blockers);
 out.push(...reserve);blockers.push(...reserve);
 let personal=out.filter(x=>x.assumed);const manual=[];
 for(const o of p.overrides||[]){const zone=o.port==='UNKNOWN'?home:o.port;const start=instant(o.date,'0000',zone),end=instant(dayAdd(o.date,1),'0000',zone);
 personal=subtract(personal,[{start,end}]);const remaining=subtract(manual,[{start,end}]);manual.splice(0,manual.length,...remaining);
 if(o.port!=='UNKNOWN')manual.push({start,end,port:o.port,desc:'Manually entered location · '+o.port,assumed:false,manual:true});
 }
 // Commutes take precedence over date overrides. Transit is always unassigned.
 for(const c of p.commutes||[]){const start=instant(c.depDate,c.depTime,c.from),end=instant(c.arrDate,c.arrTime,c.to);

 personal=subtract(personal,[{start:ds,end:de}]);const remaining=subtract(manual,[{start:ds,end:de}]);manual.splice(0,manual.length,...remaining);
 manual.push({start:ds,end:start,port:c.from,desc:'Before entered commute · '+c.from,assumed:false,manual:true},{start:end,end:de,port:c.to,desc:'After entered commute · '+c.to,assumed:false,manual:true});
 }

function findOverlaps(a,b){const raw=[];for(const x of a)for(const y of b)if(x.port===y.port){const start=Math.max(x.start,y.start),end=Math.min(x.end,y.end);if(end>start)raw.push({start,end,port:x.port,assumed:x.assumed||y.assumed,manual:!!(x.manual||y.manual),descsA:[x.desc],descsB:[y.desc]});}
 raw.sort((x,y)=>x.port.localeCompare(y.port)||x.start-y.start);const merged=[];
 for(const o of raw){const last=merged.at(-1);if(last&&last.port===o.port&&last.assumed===o.assumed&&last.manual===o.manual&&JSON.stringify(last.descsA)===JSON.stringify(o.descsA)&&JSON.stringify(last.descsB)===JSON.stringify(o.descsB)&&o.start<=last.end){last.end=Math.max(last.end,o.end);last.descsA=[...new Set([...last.descsA,...o.descsA])];last.descsB=[...new Set([...last.descsB,...o.descsB])];}else merged.push({...o});}
 return merged.sort((a,b)=>a.start-b.start);
}
function invalidate(){pairsData=[];document.getElementById('results').classList.remove('show');document.getElementById('printBtn').style.display='none';}
const CITY_NAMES={ADL:'Adelaide',MEL:'Melbourne',SYD:'Sydney',BNE:'Brisbane',PER:'Perth',DRW:'Darwin',HBA:'Hobart',CBR:'Canberra',OOL:'Gold Coast',AKL:'Auckland',LAX:'Los Angeles',DFW:'Dallas/Fort Worth'};
function portOptions(selected,unknown=false){return (unknown?'<option value="UNKNOWN">Unknown / away</option>':'')+Object.keys(ZONES).sort().map(port=>`<option value="${port}" ${port===selected?'selected':''}>${port}${CITY_NAMES[port]?' — '+CITY_NAMES[port]:''}</option>`).join('');}
function homeControls(p,i){return `<div class="home-controls"><label>Home city / domicile<select aria-label="Home city for ${esc(p.name)}" onchange="setHome(${i},this.value)">${portOptions(p.home)}</select></label><details><summary>Adjust dates / enter commute</summary><p class="small-note">Personal locations apply outside rostered duty. Date overrides use the selected city’s local date. Unknown uses home-city time. Commutes override date entries and leave transit unassigned.</p><div class="edit-box"><strong>Date override</strong><label>Date<input id="override-date-${i}" type="date" min="${p.start}" max="${p.end}" value="${p.start}"></label><label>Location<select id="override-port-${i}">${portOptions(p.home,true)}</select></label><button class="btn" onclick="addOverride(${i})">Set date</button></div><div class="edit-box"><strong>Commute (local times at each airport)</strong><label>From<select id="from-${i}">${portOptions(p.home)}</select></label><label>Departure date<input id="dep-date-${i}" type="date" value="${p.start}"></label><label>Departure time<input id="dep-time-${i}" type="time"></label><label>To<select id="to-${i}">${portOptions(p.base)}</select></label><label>Arrival date<input id="arr-date-${i}" type="date" value="${p.start}"></label><label>Arrival time<input id="arr-time-${i}" type="time"></label><button class="btn" onclick="addCommute(${i})">Add commute</button></div><div>${p.overrides.map((o,k)=>`<div class="saved-edit">${fmtDate(o.date)} · ${o.port}<button onclick="removeEdit(${i},'overrides',${k})">Remove</button></div>`).join('')}${p.commutes.map((c,k)=>`<div class="saved-edit">${fmtDate(c.depDate)} ${c.depTime.slice(0,2)}:${c.depTime.slice(2)} ${c.from} → ${fmtDate(c.arrDate)} ${c.arrTime.slice(0,2)}:${c.arrTime.slice(2)} ${c.to}<button onclick="removeEdit(${i},'commutes',${k})">Remove</button></div>`).join('')}</div></details><p class="small-note">Settings last until this page is closed or the pilot is removed.</p></div>`;}
function refreshSettings(){invalidate();renderUploadGrid();showError('');}
function setHome(i,port){if(!ZONES[port])return;pilots[i].home=port;refreshSettings();}
const field=id=>document.getElementById(id).value;
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d+'T12:00Z'))&&iso(Date.parse(d+'T12:00Z'))===d;}
function addOverride(i){try{const p=pilots[i],date=field('override-date-'+i),port=field('override-port-'+i);if(!validDate(date)||date<p.start||date>p.end)throw Error('Choose a date within this roster.');if(port!=='UNKNOWN'&&!ZONES[port])throw Error('Choose a location.');p.overrides=p.overrides.filter(o=>o.date!==date);p.overrides.push({date,port});refreshSettings();}catch(e){showError(e.message);}}
function addCommute(i){try{const p=pilots[i],c={from:field('from-'+i),to:field('to-'+i),depDate:field('dep-date-'+i),arrDate:field('arr-date-'+i),depTime:field('dep-time-'+i).replace(':',''),arrTime:field('arr-time-'+i).replace(':','')};
 if(!validDate(c.depDate)||!validDate(c.arrDate)||c.depDate<p.start||c.arrDate>p.end)throw Error('Choose commute dates within this roster.');if(c.from===c.to)throw Error('Choose different departure and arrival cities.');
 const start=instant(c.depDate,c.depTime,c.from),end=instant(c.arrDate,c.arrTime,c.to);if(end<=start||end-start>48*3600000)throw Error('Arrival must follow departure and be within 48 hours.');
 const known=buildTimeline({...p,overrides:[],commutes:[]},false);if([...p.patterns,...known].some(x=>x.start<end&&x.end>start))throw Error('This commute conflicts with rostered duty or a known layover. Check the times.');
 if(p.commutes.some(x=>instant(x.depDate,'0000',x.from)<instant(dayAdd(c.arrDate,1),'0000',c.to)&&instant(dayAdd(x.arrDate,1),'0000',x.to)>instant(c.depDate,'0000',c.from)))throw Error('A commute already covers these dates. Remove it first to replace it.');
 p.commutes.push(c);refreshSettings();}catch(e){showError(e.message);}}
function removeEdit(i,key,k){if(!['overrides','commutes'].includes(key))return;pilots[i][key].splice(k,1);refreshSettings();}
function renderUploadGrid(){document.getElementById('upload-grid').innerHTML=pilots.map((p,i)=>`<div class="upload-slot loaded" style="border-color:${p.colour}"><button class="remove-btn" onclick="removePilot(${i})">✕ Remove</button><div class="upload-slot-icon">✓</div><div class="upload-slot-title" style="color:${p.colour}">${p.format} loaded</div><div class="pilot-name-display">${esc(p.name)}</div><div class="pilot-meta">Base: ${p.base} · Staff: ${p.staffNo}<br>${p.patterns.length} duty blocks · ${new Set(p.duties.map(d=>d.date)).size} roster days<br>${fmtDate(p.start)} – ${fmtDate(p.end)}</div>${homeControls(p,i)}</div>`).join('')+(pilots.length<6?'<div class="upload-slot"><input aria-label="Add roster text files" type="file" accept=".txt,text/plain" multiple onchange="loadFile(event)"><div class="add-slot"><div class="add-slot-icon">+</div><div>Add pilot rosters</div><div>WEBCIS or ARMS .txt</div></div></div>':'');document.getElementById('analyseBtn').disabled=pilots.length<2;
 document.getElementById('bid-tag').textContent=pilots.length?`${pilots.length} roster${pilots.length===1?'':'s'} loaded · processed on your device`:'Upload rosters to begin';}
function showError(s){document.getElementById('error-box').innerHTML=s?`<div class="error-box" role="alert">${esc(s)}</div>`:'';}
async function loadFile(e){const files=[...e.target.files];invalidate();let errors=[];for(const file of files){try{if(pilots.length>=6)throw Error('Maximum six pilots.');if(file.size>5*1024*1024)throw Error('File exceeds 5 MB.');const p=parseRoster(await file.text(),COLOURS.find(c=>!pilots.some(p=>p.colour===c)));if(pilots.some(x=>x.staffNo===p.staffNo))throw Error('This pilot is already loaded; remove the old roster first.');pilots.push(p);}catch(err){errors.push(file.name+': '+err.message);}}renderUploadGrid();showError(errors.join('\n'));}
function removePilot(i){pilots.splice(i,1);invalidate();renderUploadGrid();showError('');}
function clearAll(){document.getElementById('roster-setup').open=true;pilots=[];invalidate();renderUploadGrid();showError('');}
function analyse(){try{if(pilots.length<2)return;const assume=document.getElementById('assumeBase').checked,min=+document.getElementById('minMinutes').value;const tls=pilots.map(p=>buildTimeline(p,assume));pairsData=[];
 for(let i=0;i<pilots.length;i++)for(let j=i+1;j<pilots.length;j++){const start=pilots[i].start>pilots[j].start?pilots[i].start:pilots[j].start,end=pilots[i].end<pilots[j].end?pilots[i].end:pilots[j].end;
 const ovs=findOverlaps(tls[i],tls[j]).filter(o=>(document.getElementById('showHomeTurns').checked||!isAirportCityCrossover(o))&&(o.end-o.start)/60000>=min);pairsData.push({i,j,start,end,ovs,total:ovs.reduce((s,o)=>s+(o.end-o.start)/60000,0)});}
 activePair=0;renderResults();document.getElementById('roster-setup').open=false;document.getElementById('results').classList.add('show');document.getElementById('printBtn').style.display='inline-flex';showError('');
 }catch(err){invalidate();showError(err.message);}}
function renderResults(){const all=pairsData.flatMap(p=>p.ovs),stats=[['Pilots',pilots.length],['Overlap windows',all.length],['Total across pairs',duration(pairsData.reduce((s,p)=>s+p.total,0))],['Ports in common',new Set(all.map(o=>o.port)).size]];document.getElementById('stats-row').innerHTML=stats.map(([label,n])=>`<div class="stat-tile"><div class="stat-tile-label">${label}</div><div class="stat-tile-value" style="color:var(--accent)">${n}</div></div>`).join('');document.getElementById('pair-tabs').innerHTML=pairsData.map((p,k)=>`<button class="pair-tab ${k===activePair?'active':''}" onclick="activePair=${k};renderResults()">${esc(pilots[p.i].name.split(' ')[0])} + ${esc(pilots[p.j].name.split(' ')[0])} · ${dailyOverlapGroups(p).length} overlaps</button>`).join('');renderPairView();}
function rosterDayDisplay(p,date){const ds=p.duties.filter(d=>d.date===date);if(!ds.length)return '<div class="duty-tag type-unknown">Outside supplied roster</div>';
 const pats=p.patterns.filter(x=>localDate(x.start,p.base)<=date&&localDate(x.end,p.base)>=date);
 if(pats.length)return pats.map(x=>`<div class="duty-tag type-fly">✈ Duty / trip</div><div class="pattern-route">${x.legs[0].dep} → ${x.legs.map(l=>l.arr).join(' → ')}</div>`).join('');
 return ds.map(d=>`<div class="duty-tag type-${d.type==='DO'?'off':d.type==='LEAVE'?'leave':d.type==='RESERVE'?'rsv':'unknown'}">${esc(({DO:'Day off',LEAVE:'Leave — location unknown',RESERVE:'Reserve / available — excluded',OTHER:'Duty — location unknown'})[d.type])} (${esc(d.code)})</div>`).join('');}
function rowDisplay(p,date){
 const home=p.home||p.base;const tls=buildTimeline(p,document.getElementById('assumeBase').checked);
 const entries=tls.filter(x=>(x.assumed||x.manual)&&localDate(x.start,home)<=date&&localDate(x.end-1,home)>=date);
 const notes=[...new Set(entries.map(x=>(x.assumed?'Assumed home: ':'Entered location: ')+x.port))];
 if(!notes.length&&p.patterns.some(x=>x.legs[0].dep===p.base&&localDate(x.start,home)===date))notes.push('Departure day · no assumed home time');
 return rosterDayDisplay(p,date)+notes.map(n=>'<div class="location-note">'+esc(n)+'</div>').join('');
}
function homeKind(o,a,b){const n=Number(o.port===(a.home||a.base))+Number(o.port===(b.home||b.base));return ['away-port','one-home','both-home'][n];}
function homeLabel(o,a,b){const kind=homeKind(o,a,b);return kind==='both-home'?'Both home cities':kind==='one-home'?'One home city':'Away for both';}
function isAirportCityCrossover(o){
 const airport=descs=>descs.some(d=>/^(Turn|Reporting|Post-flight|Training)/.test(d));
 const city=descs=>descs.length>0&&descs.every(d=>d.includes('assumed home')||/^(Away-port layover|Layover|Manually entered location|Before entered commute|After entered commute|Reserve R5)/.test(d));
 return (airport(o.descsA)&&city(o.descsB))||(airport(o.descsB)&&city(o.descsA));
}
function overlapStatus(descs){return [...new Set(descs.map(d=>d.startsWith('Reserve R5')?'Reserve / on call':d.includes('assumed home')?'Home — assumed':d.startsWith('Turn')?'Turnaround / on duty':d.startsWith('Reporting')?'Pre-flight / on duty':d.startsWith('Post-flight')?'Post-flight / on duty':d.startsWith('Training')?'Ground duty':d.startsWith('Away-port')?'Off duty / layover':d.startsWith('Layover')?'Layover / duty status unspecified':'Location entered / outside rostered duty'))].join('; ');}
function dailyOverlapGroups(pair){
 // Merge continuous presence before formatting dates; midnight is not a gap.
 const merged=[];
 for(const item of [...pair.ovs].sort((a,b)=>a.port.localeCompare(b.port)||a.start-b.start)){
 const o={...item,segments:[{...item}]},last=merged.at(-1);
 if(last&&last.port===o.port&&o.start<=last.end){last.end=Math.max(last.end,o.end);last.assumed ||= o.assumed;last.manual ||= o.manual;last.segments.push(...o.segments);}else merged.push(o);
 }
 return merged.sort((a,b)=>a.start-b.start).map(o=>({date:localDate(o.start,o.port),endDate:localDate(o.end,o.port),windows:[o]}));
}
function shortDate(date){return new Date(date+'T12:00Z').toLocaleDateString('en-AU',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'});}
function overlapDateLabel(date,endDate){return shortDate(date)+(endDate!==date?' → '+shortDate(endDate):'');}
function windowTime(o,date){
 const startDate=localDate(o.start,o.port),endDate=localDate(o.end,o.port);
 if(startDate===endDate)return (date&&startDate!==date?shortDate(startDate)+' · ':'')+clock(o.start,o.port)+' – '+clock(o.end,o.port);
 const day=t=>new Date(t+'T12:00Z').toLocaleDateString('en-AU',{timeZone:'UTC',weekday:'short',day:'numeric'});
 return day(startDate)+' '+clock(o.start,o.port)+' → '+day(endDate)+' '+clock(o.end,o.port);
}
function renderPairView(){
 const pair=pairsData[activePair],a=pilots[pair.i],b=pilots[pair.j],days=dailyOverlapGroups(pair);
 const warnings=[...a.warnings.map(w=>a.name+': '+w),...b.warnings.map(w=>b.name+': '+w)];
 document.getElementById('sum-section').innerHTML=`<div class="match-heading"><h2>${days.length} overlap${days.length===1?'':'s'}</h2><p>${esc(a.name)} &amp; ${esc(b.name)}</p><span>Times are local to each port · * includes assumed presence</span></div>`;
 document.getElementById('cal-section').innerHTML=days.length?`<div class="match-list">${days.map(({date,endDate,windows})=>`<section class="match-day"><div class="match-date"><strong>${overlapDateLabel(date,endDate)}</strong><span>${date.slice(0,4)}${endDate.slice(0,4)!==date.slice(0,4)?'–'+endDate.slice(0,4):''}</span></div><div class="match-windows">${windows.map(o=>`<div class="match-window ${homeKind(o,a,b)}"><div class="match-line"><strong class="match-port">${o.port}</strong><strong class="match-time">${windowTime(o,date)}${o.assumed?' *':''}</strong><span class="match-duration">${duration((o.end-o.start)/60000)}</span><span class="match-kind">${homeLabel(o,a,b)}</span></div><details class="match-details"><summary>Details</summary>${o.segments.map(seg=>`<div class="match-detail"><strong>${windowTime(seg,date)}</strong><div>${esc(a.name)}: ${esc(overlapStatus(seg.descsA))}</div><div>${esc(b.name)}: ${esc(overlapStatus(seg.descsB))}</div><small>${seg.descsA.concat(seg.descsB).map(esc).join(' · ')}</small></div>`).join('')}</details></div>`).join('')}</div></section>`).join('')}</div>`:'<div class="no-overlap-msg"><h3>No overlaps</h3><p>Try a shorter minimum duration or check the home-city settings.</p></div>';
 document.getElementById('cal-section').innerHTML+=`<details class="background-details"><summary>Assumptions, home cities &amp; import notes${warnings.length?' ('+warnings.length+')':''}</summary><p>${esc(a.name)}: home ${a.home||a.base}, base ${a.base}. ${esc(b.name)}: home ${b.home||b.base}, base ${b.base}.</p><p>Green: both home cities. Purple: one home city. Blue: away for both. Colours show location, not availability. Overlaps include time on duty. Airport duty versus home or hotel stays is hidden by default; enable these crossovers in Rosters &amp; settings. Both-at-airport and both-off-duty overlaps remain included. A layover indicates presence in the city, not confirmed presence at the airport.</p><p>* Assumed presence includes days off and arrival-day home time immediately after duty release. Commutes are not timed unless entered. Overnight-trip departure days have no assumed home time. RX, AL (annual leave), AV, A, BL and MS count as assumed full days at home unless rostered travel takes priority. Same-day duties starting and ending at home include assumed home time until report. R5 indicates reserve in the selected home port from 05:00 to 17:00 local and is included as on-call presence. Undecoded trips are treated as away and unavailable for catch-ups. Rostered duties take priority. Continuous overlaps are combined across midnight; genuine gaps remain separate; expand Details to see changes in duty status.</p>${warnings.length?'<ul>'+warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':''}</details>`;
}
function printReport(){window.print();}
renderUploadGrid();

</script>
